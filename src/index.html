<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soracle Launcher</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <button id="fetch-manifest-btn">Fetch Manifest</button>
    <pre id="manifest-output"></pre>
    <button id="download-nwh-btn">Download NWH</button>
    <pre id="download-output"></pre>
    <button id="extract-nwh-btn">Extract NWH</button>
    <pre id="extract-output"></pre>
    <button id="locate-jk2-btn">Locate JK2</button>
    <pre id="locate-output"></pre>
    <button id="locate-jk2-base-btn">Locate JK2 Base</button>
    <pre id="locate-base-output"></pre>
    <button id="download-tommyternal-btn">Download Tommyternal</button>
    <pre id="download-tommyternal-output"></pre>
    <button id="extract-tommyternal-btn">Extract Tommyternal</button>
    <pre id="extract-tommyternal-output"></pre>
    <button id="preview-install-tommyternal-btn">Preview Install Tommyternal</button>
    <pre id="preview-install-output"></pre>
    <button id="install-tommyternal-btn">Install Tommyternal</button>
    <pre id="install-output"></pre>
  </body>
</html>
