[package]
name = "soracle-launcher"
version = "0.1.0"
description = "Soracle community launcher for JK2 client mods"
authors = ["Soracle"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "soracle_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
# Local debug symbols (function/variable names for backtraces) aren't useful
# in a shipped app and were never being stripped - this is the single
# biggest, completely free win available: no feature, dependency, or
# behavior change, just less dead weight riding along in every build.
strip = true
# Whole-program link-time optimization - lets the compiler inline and dead-
# code-eliminate across crate boundaries (560 of them here), not just within
# each one. codegen-units = 1 gives it the whole program to work with at
# once instead of splitting compilation into parallel chunks first - slower
# to build, doesn't change what ships.
lto = true
codegen-units = 1

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tar = "0.4.46"
flate2 = "1.1.10"
steamlocate = "2.1.1"
zip = { version = "8", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JK2MV has no official portable/tar.gz build for Linux, only a .deb - read
# straight out of it (control.tar.gz/data.tar.gz inside a Unix ar archive)
# rather than requiring dpkg/root to actually install the package.
[target.'cfg(target_os = "linux")'.dependencies]
ar = "0.9"

